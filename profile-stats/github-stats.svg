    <!-- Full-width Multi-Color Progress Bar -->
    <g clip-path="url(#lang-bar-clip)">
      <rect x="48.0" y="385" width="471.0" height="11" fill="#3178c6" />
      <rect x="519.0" y="385" width="227.0" height="11" fill="#f1e05a" />
      <rect x="745.9" y="385" width="116.9" height="11" fill="#3572A5" />
      <rect x="862.8" y="385" width="108.0" height="11" fill="#663399" />
      <rect x="970.9" y="385" width="4.3" height="11" fill="#e34c26" />
      <rect x="975.1" y="385" width="0.9" height="11" fill="#C1F12E" />
    </g>

    <!-- Center vertical separator line -->
