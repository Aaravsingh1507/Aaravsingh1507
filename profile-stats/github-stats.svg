      <circle cx="136" cy="421" r="5" fill="#3178c6" />
      <text x="156" y="426" font-size="13" font-weight="500" fill="#c9d1d9">TypeScript</text>
      <text x="420" y="426" text-anchor="end" font-size="13" font-weight="600" fill="#f0f6fc">50.75%</text>
    </g>
    <g>
      <circle cx="136" cy="447" r="5" fill="#f1e05a" />
      <text x="156" y="452" font-size="13" font-weight="500" fill="#c9d1d9">JavaScript</text>
      <text x="420" y="452" text-anchor="end" font-size="13" font-weight="600" fill="#f0f6fc">24.46%</text>
    </g>
    <g>
      <circle cx="136" cy="473" r="5" fill="#3572A5" />
      <text x="156" y="478" font-size="13" font-weight="500" fill="#c9d1d9">Python</text>
      <text x="420" y="478" text-anchor="end" font-size="13" font-weight="600" fill="#f0f6fc">12.59%</text>
    </g>
    <g>
      <circle cx="602" cy="421" r="5" fill="#663399" />
      <text x="622" y="426" font-size="13" font-weight="500" fill="#c9d1d9">CSS</text>
      <text x="890" y="426" text-anchor="end" font-size="13" font-weight="600" fill="#f0f6fc">11.64%</text>
    </g>
    <g>
      <circle cx="602" cy="447" r="5" fill="#e34c26" />
      <text x="622" y="452" font-size="13" font-weight="500" fill="#c9d1d9">HTML</text>
      <text x="890" y="452" text-anchor="end" font-size="13" font-weight="600" fill="#f0f6fc">0.46%</text>
    </g>
    <g>
