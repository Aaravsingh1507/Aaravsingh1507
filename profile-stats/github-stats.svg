    <!-- Label -->
    <text x="912" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f6fc">Longest Streak</text>
    <!-- Range -->
    <text x="912" y="280" text-anchor="middle" font-size="12" font-weight="500" fill="#3fb950">Oct 3 - Oct 7</text>
  </g>

