    <!-- Label -->
    <text x="520" y="280" text-anchor="middle" font-size="13" font-weight="500" fill="#c9d1d9">Total Contributions</text>
    <!-- Range -->
    <text x="520" y="302" text-anchor="middle" font-size="12" font-weight="500" fill="#3fb950">Aug 11, 2025 - Present</text>
  </g>

