<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="850" height="250">
  <defs>
    <!-- Import Google Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Outfit:wght@400;600;800&amp;display=swap');

      /* Global Styles */
      .terminal-title {
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #9ca3af;
      }
      .terminal-text {
        font-family: 'Fira Code', monospace;
        font-size: 15px;
        fill: #a9b1d6;
      }
      .bold-text {
        font-weight: 700;
      }
      .prompt-user {
        fill: #7aa2f7;
        font-weight: bold;
      }
      .prompt-symbol {
        fill: #bb9af3;
        font-weight: bold;
      }
      .prompt-cmd {
        fill: #a9b1d6;
      }
      .highlight-name {
        fill: #7dd3fc;
        font-weight: bold;
        filter: drop-shadow(0 0 5px rgba(125, 211, 252, 0.6));
      }
      .highlight-role {
        fill: #e0af68;
        font-weight: bold;
      }
      .highlight-skills {
        fill: #9ece6a;
        font-weight: bold;
      }
      .highlight-status {
        fill: #f7768e;
        font-weight: bold;
      }

      /* Animated Lines (Typing Effect via Clip Path) */
      .line-1 {
        clip-path: inset(0 100% 0 0);
        animation: type-line-1 14s infinite steps(40);
      }
      .line-2 {
        clip-path: inset(0 100% 0 0);
        animation: type-line-2 14s infinite steps(40);
      }
      .line-3 {
        clip-path: inset(0 100% 0 0);
        animation: type-line-3 14s infinite steps(50);
      }
      .line-4 {
        clip-path: inset(0 100% 0 0);
        animation: type-line-4 14s infinite steps(50);
      }

      /* Cursor Animation */
      .cursor {
        fill: #7aa2f7;
        animation: blink 0.8s infinite;
      }
      .cursor-1 { animation: blink 0.8s infinite, cursor-move-1 14s infinite; }
      .cursor-2 { animation: blink 0.8s infinite, cursor-move-2 14s infinite; }
      .cursor-3 { animation: blink 0.8s infinite, cursor-move-3 14s infinite; }
      .cursor-4 { animation: blink 0.8s infinite, cursor-move-4 14s infinite; }

      /* Keyframes for Typing */
      @keyframes type-line-1 {
        0% { clip-path: inset(0 100% 0 0); }
        10% { clip-path: inset(0 0 0 0); }
        92% { clip-path: inset(0 0 0 0); }
        96%, 100% { clip-path: inset(0 100% 0 0); }
      }
      @keyframes type-line-2 {
        0%, 12% { clip-path: inset(0 100% 0 0); }
        24% { clip-path: inset(0 0 0 0); }
        92% { clip-path: inset(0 0 0 0); }
        96%, 100% { clip-path: inset(0 100% 0 0); }
      }
      @keyframes type-line-3 {
        0%, 26% { clip-path: inset(0 100% 0 0); }
        42% { clip-path: inset(0 0 0 0); }
        92% { clip-path: inset(0 0 0 0); }
        96%, 100% { clip-path: inset(0 100% 0 0); }
      }
      @keyframes type-line-4 {
        0%, 44% { clip-path: inset(0 100% 0 0); }
        62% { clip-path: inset(0 0 0 0); }
        92% { clip-path: inset(0 0 0 0); }
        96%, 100% { clip-path: inset(0 100% 0 0); }
      }

      /* Keyframes for Cursor Movement */
      @keyframes cursor-move-1 {
        0% { opacity: 1; transform: translateX(0px); }
        10% { opacity: 0; transform: translateX(110px); }
        100% { opacity: 0; }
      }
      @keyframes cursor-move-2 {
        0%, 12% { opacity: 0; transform: translateX(0px); }
        13% { opacity: 1; transform: translateX(0px); }
        24% { opacity: 0; transform: translateX(330px); }
        100% { opacity: 0; }
      }
      @keyframes cursor-move-3 {
        0%, 26% { opacity: 0; transform: translateX(0px); }
        27% { opacity: 1; transform: translateX(0px); }
        42% { opacity: 0; transform: translateX(580px); }
        100% { opacity: 0; }
      }
      @keyframes cursor-move-4 {
        0%, 44% { opacity: 0; transform: translateX(0px); }
        45% { opacity: 1; transform: translateX(0px); }
        62% { opacity: 1; transform: translateX(430px); }
        92% { opacity: 1; transform: translateX(430px); }
        93%, 100% { opacity: 0; }
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      /* Tokyo Night Border Pulse */
      .border-glow {
        stroke: url(#tokyoGradient);
        stroke-width: 2;
        filter: drop-shadow(0 0 8px rgba(122, 162, 247, 0.4));
        animation: border-pulse 4s infinite alternate;
      }
      @keyframes border-pulse {
        0% { filter: drop-shadow(0 0 4px rgba(122, 162, 247, 0.3)); }
        100% { filter: drop-shadow(0 0 12px rgba(187, 153, 243, 0.7)); }
      }
    </style>

    <!-- Glowing Tokyo Night Gradient -->
    <linearGradient id="tokyoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#bb9af3" />
      <stop offset="100%" stop-color="#7dcfff" />
    </linearGradient>

    <!-- Tech Grid Background -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2335" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Terminal Window Background (Glow & Rounded Card) -->
  <rect x="15" y="15" width="820" height="220" rx="12" fill="#1a1b26" class="border-glow" />
  <!-- Grid Fill -->
  <rect x="16" y="16" width="818" height="218" rx="12" fill="url(#grid)" />

  <!-- Terminal Header / Title Bar -->
  <g>
    <!-- Control Dots (Mac Style) -->
    <circle cx="40" cy="40" r="6" fill="#f7768e" />
    <circle cx="60" cy="40" r="6" fill="#e0af68" />
    <circle cx="80" cy="40" r="6" fill="#9ece6a" />
    
    <!-- Window Title -->
    <text x="425" y="45" text-anchor="middle" class="terminal-title">aarav@ai-developer:~</text>
    
    <!-- Header Separation Line -->
    <line x1="15" y1="60" x2="835" y2="60" stroke="#1f2335" stroke-width="1.5" />
  </g>

  <!-- Terminal Body Content -->
  <g transform="translate(40, 75)">
    <!-- Line 1: whoami command -->
    <g transform="translate(0, 20)">
      <text class="terminal-text bold-text">
        <tspan class="prompt-user">aarav</tspan><tspan class="prompt-symbol">@github</tspan><tspan fill="#565f89">:~$</tspan> <tspan class="prompt-cmd">whoami: </tspan>
      </text>
      <text x="180" y="0" class="terminal-text line-1"><tspan class="highlight-name">Aarav Singh</tspan></text>
      <rect x="180" y="-14" width="8" height="17" class="cursor-1" />
    </g>

    <!-- Line 2: Focus -->
    <g transform="translate(0, 50)">
      <text class="terminal-text line-2">
        <tspan fill="#565f89">&gt; Focus:</tspan> <tspan class="highlight-role">Machine Learning &amp; AI Agents</tspan>
      </text>
      <rect x="0" y="-14" width="8" height="17" class="cursor-2" />
    </g>

    <!-- Line 3: Tech Stack array -->
    <g transform="translate(0, 80)">
      <text class="terminal-text line-3">
        <tspan fill="#565f89">&gt; Stack:</tspan> <tspan class="highlight-skills">["Python", "JS", "TS", "React", "Next.js", "Node"]</tspan>
      </text>
      <rect x="0" y="-14" width="8" height="17" class="cursor-3" />
    </g>

    <!-- Line 4: Status -->
    <g transform="translate(0, 110)">
      <text class="terminal-text line-4">
        <tspan fill="#565f89">&gt; Status:</tspan> <tspan class="highlight-status">Building the future with AI Agents...</tspan>
      </text>
      <rect x="0" y="-14" width="8" height="17" class="cursor-4" />
    </g>
  </g>
</svg>
