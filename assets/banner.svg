<svg xmlns="http://www.w3.org/2000/svg" width="850" height="180" viewBox="0 0 850 180">
  <defs>
    <!-- Animated gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#161b22;#0d1117" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" style="stop-color:#161b22">
        <animate attributeName="stop-color" values="#161b22;#1f6feb20;#161b22" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#161b22;#0d1117" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Stronger glow for accent -->
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');

    .name {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 42px;
      font-weight: 700;
      fill: #c9d1d9;
      opacity: 0;
      animation: fadeSlideUp 1s ease-out 0.3s forwards;
    }

    .subtitle {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 400;
      fill: #8b949e;
      opacity: 0;
      animation: fadeSlideUp 1s ease-out 0.7s forwards;
    }

    .accent-line {
      stroke: #1f6feb;
      stroke-width: 2;
      opacity: 0;
      animation: expandLine 1.2s ease-out 0.5s forwards;
      filter: url(#glow);
    }

    .dot {
      fill: #1f6feb;
      opacity: 0;
      animation: pulseDot 3s ease-in-out infinite;
    }

    .dot-1 { animation-delay: 0s; }
    .dot-2 { animation-delay: 0.5s; }
    .dot-3 { animation-delay: 1s; }
    .dot-4 { animation-delay: 1.5s; }
    .dot-5 { animation-delay: 2s; }

    .grid-line {
      stroke: #21262d;
      stroke-width: 0.5;
      opacity: 0;
      animation: fadeIn 2s ease-out 0.2s forwards;
    }

    .float-particle {
      fill: #1f6feb;
      opacity: 0;
    }

    .p1 { animation: floatUp 8s ease-in-out infinite 0s; }
    .p2 { animation: floatUp 10s ease-in-out infinite 1.5s; }
    .p3 { animation: floatUp 7s ease-in-out infinite 3s; }
    .p4 { animation: floatUp 9s ease-in-out infinite 0.8s; }
    .p5 { animation: floatUp 11s ease-in-out infinite 2s; }
    .p6 { animation: floatUp 8s ease-in-out infinite 4s; }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes expandLine {
      from { opacity: 0; stroke-dasharray: 0 200; }
      to { opacity: 0.8; stroke-dasharray: 200 0; }
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.15; r: 1.5; }
      50% { opacity: 0.5; r: 2.5; }
    }

    @keyframes fadeIn {
      to { opacity: 0.4; }
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(20px); }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-160px); }
    }
  </style>

  <!-- Background -->
  <rect width="850" height="180" fill="url(#bg)" rx="6" />

  <!-- Subtle grid -->
  <line class="grid-line" x1="0" y1="45" x2="850" y2="45" />
  <line class="grid-line" x1="0" y1="90" x2="850" y2="90" />
  <line class="grid-line" x1="0" y1="135" x2="850" y2="135" />
  <line class="grid-line" x1="212" y1="0" x2="212" y2="180" />
  <line class="grid-line" x1="425" y1="0" x2="425" y2="180" />
  <line class="grid-line" x1="638" y1="0" x2="638" y2="180" />

  <!-- Floating particles -->
  <circle class="float-particle p1" cx="120" cy="170" r="1.5" />
  <circle class="float-particle p2" cx="300" cy="175" r="1" />
  <circle class="float-particle p3" cx="500" cy="168" r="1.8" />
  <circle class="float-particle p4" cx="680" cy="172" r="1.2" />
  <circle class="float-particle p5" cx="780" cy="165" r="1.5" />
  <circle class="float-particle p6" cx="200" cy="178" r="1" />

  <!-- Accent dots -->
  <circle class="dot dot-1" cx="80" cy="90" r="1.5" />
  <circle class="dot dot-2" cx="770" cy="50" r="1.5" />
  <circle class="dot dot-3" cx="150" cy="140" r="1.5" />
  <circle class="dot dot-4" cx="700" cy="130" r="1.5" />
  <circle class="dot dot-5" cx="400" cy="30" r="1.5" />

  <!-- Accent line under name -->
  <line class="accent-line" x1="345" y1="105" x2="505" y2="105" />

  <!-- Name -->
  <text class="name" x="425" y="90" text-anchor="middle">Aarav Singh</text>

  <!-- Subtitle -->
  <text class="subtitle" x="425" y="130" text-anchor="middle">AI Explorer  •  Python Developer  •  Web Enthusiast</text>

  <!-- Bottom edge glow -->
  <rect x="0" y="175" width="850" height="5" fill="url(#bg)" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite" />
  </rect>
</svg>
