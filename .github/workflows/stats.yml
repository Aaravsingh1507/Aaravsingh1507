name: Generate GitHub Stats Cards

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stats.yml"

jobs:
  update-stats:
    runs-on: ubuntu-latest
    name: Update GitHub Stats & Top Languages Cards
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate GitHub Statistics Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_dashboard.py

      - name: Commit & Push updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-stats/*.svg
          git diff --staged --quiet || git commit -m "📊 Update GitHub statistics dashboard"
          git push
